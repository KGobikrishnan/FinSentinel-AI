services:
  # 1. PostgreSQL 16 with pgvector Extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: finsentinel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: finsentinel
      POSTGRES_USER: finsentinel
      POSTGRES_PASSWORD: sentinel_secret_2026
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finsentinel -d finsentinel"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - finsentinel_net

  # 2. Redis 7 for Distributed Locks (Redisson) & Idempotency
  redis:
    image: redis:7-alpine
    container_name: finsentinel_redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - finsentinel_net

  # 3. FinSentinel AI Backend (Spring Boot 3.3 + Java 21 Virtual Threads)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finsentinel_backend
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: finsentinel
      DB_USER: finsentinel
      DB_PASSWORD: sentinel_secret_2026
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-mock-local-ai-key}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - finsentinel_net

  # 4. FinSentinel AI Frontend (React 19 + Vite + TypeScript)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finsentinel_frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - finsentinel_net

  # 5. Nginx Reverse Proxy (HTTP/2, Gzip & WebSocket Proxy)
  nginx:
    image: nginx:1.27-alpine
    container_name: finsentinel_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - finsentinel_net

volumes:
  pgdata:
  redisdata:

networks:
  finsentinel_net:
    driver: bridge
