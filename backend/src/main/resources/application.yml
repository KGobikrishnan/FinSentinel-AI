server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: finsentinel-ai
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:finsentinel}
    username: ${DB_USER:finsentinel}
    password: ${DB_PASSWORD:sentinel_secret_2026}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: FinSentinelHikariPool
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 20000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        show_sql: false
        jdbc:
          batch_size: 50
          batch_versioned_data: true
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    locations: classpath:db/migration

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:mock-local-ai-key}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
          temperature: 0.1
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
        initialize-schema: false

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# Redis & Redisson Configuration
redisson:
  singleServerConfig:
    address: "redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}"
    password: ${REDIS_PASSWORD:null}
    connectionPoolSize: 64
    connectionMinimumIdleSize: 16
    connectTimeout: 10000
    timeout: 3000

# Application Custom Security & Ledger Settings
finsentinel:
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:80,http://localhost,http://127.0.0.1:*}
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    access-token-expiration-ms: 900000 # 15 minutes
    refresh-token-expiration-ms: 604800000 # 7 days
  ledger:
    default-currency: USD
    max-imbalance-tolerance: 0.0000
  procurement:
    price-variance-threshold-pct: 15.00
    cgst-rate: 0.09
    sgst-rate: 0.09
    igst-rate: 0.18
